name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify compiled lib matches source
        run: |
          if ! git diff --quiet -- plugins/kiro-cli/scripts/lib; then
            echo "::error::compiled lib differs from committed output. Run 'pnpm build' and commit."
            git diff -- plugins/kiro-cli/scripts/lib
            exit 1
          fi
      - run: pnpm test
