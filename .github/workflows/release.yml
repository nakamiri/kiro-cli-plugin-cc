name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - run: pnpm install --frozen-lockfile

      - name: Verify version consistency
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          MKT=$(node -p "require('./.claude-plugin/marketplace.json').metadata.version")
          PLUGIN=$(node -p "require('./plugins/kiro-cli/.claude-plugin/plugin.json').version")
          MKT_PLUGIN=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          echo "tag=$TAG pkg=$PKG mkt=$MKT plugin=$PLUGIN mkt_plugin=$MKT_PLUGIN"
          for V in "$PKG" "$MKT" "$PLUGIN" "$MKT_PLUGIN"; do
            if [ "$V" != "$TAG" ]; then
              echo "::error::version mismatch (tag=$TAG, found=$V)"
              exit 1
            fi
          done

      - run: pnpm build

      - name: Verify compiled lib is up-to-date
        run: |
          # --porcelain, not `git diff`: git diff cannot see a newly emitted but
          # uncommitted file, which is exactly how a broken plugin would ship.
          DIRTY=$(git status --porcelain -- plugins/kiro-cli/scripts/lib)
          if [ -n "$DIRTY" ]; then
            echo "::error::compiled lib differs from committed output. Run 'pnpm build' and commit."
            echo "$DIRTY"
            git diff -- plugins/kiro-cli/scripts/lib
            exit 1
          fi

      - run: pnpm test

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
